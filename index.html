<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GuitarTraining</title>
  <style>
    /* Same palette as src/theme.js ("Plein soleil"). */
    body { margin: 0; background: #ffe9c7; color: #2a2a40; font: 500 15px Fredoka, "Arial Rounded MT Bold", sans-serif; }
    #setup { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 12px 16px; }
    #setup select, #setup button { font: inherit; padding: 6px 14px; border: 0; border-radius: 999px; color: #2a2a40; background: #fff; box-shadow: 0 2px 6px rgba(42, 42, 64, .08); }
    #setup button { background: #3da5ff; color: #fff; font-weight: 600; cursor: pointer; }
    #setup button:hover { filter: brightness(1.08); }
    #setup button:focus-visible, #setup select:focus-visible { outline: 3px solid #ffc93c; }
    #status { opacity: .75; }
    #game { display: flex; justify-content: center; padding: 0 16px 16px; }
    #game canvas { border-radius: 28px; box-shadow: 0 3px 14px rgba(42, 42, 64, .08); max-width: 100%; }
  </style>
</head>
<body>
  <div id="setup">
    <label>Entrée <select id="device"></select></label>
    <label>Canal <select id="channel"><option value="0">1</option><option value="1">2</option></select></label>
    <button id="start">Activer l'audio</button>
    <span id="status">Audio coupé</span>
  </div>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
